  <title>最近 QR 點位</title>
  <style>
    :root {
      color-scheme:light;
      --bg:#fff;
      --card:#f4f4f6;
      --line:#dedee3;
      --text:#111;
      --muted:#666;
      --selected:#111;
      --selectedText:#fff;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",
        "PingFang TC","Microsoft JhengHei",sans-serif;
    }
    main {
      min-height:100vh;
      min-height:100dvh;
      width:100%;
      padding:max(14px,env(safe-area-inset-top))
              max(16px,env(safe-area-inset-right))
              max(18px,env(safe-area-inset-bottom))
              max(16px,env(safe-area-inset-left));
    }
    .shell { width:min(520px,100%); margin:0 auto; }
    .tabs {
      position:sticky;
      top:max(8px,env(safe-area-inset-top));
      z-index:10;
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:6px;
      padding:5px;
      margin:0 0 12px;
      background:rgba(244,244,246,.94);
      border:1px solid var(--line);
      border-radius:15px;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }
    .tab {
      appearance:none;
      border:0;
      border-radius:11px;
      background:transparent;
      color:var(--text);
      padding:10px 8px;
      font-size:17px;
      font-weight:900;
      line-height:1;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .tab.active { background:var(--selected); color:var(--selectedText); }
    .card {
      width:100%;
      padding:20px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:0 10px 30px rgba(0,0,0,.05);
    }
    h1 {
      margin:0 0 5px;
      font-size:clamp(24px,7vw,30px);
      line-height:1.25;
      overflow-wrap:anywhere;
    }
    .distance {
      margin:0 0 16px;
      font-size:21px;
      font-weight:900;
    }
    .qr-wrap {
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:280px;
      padding:10px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
    }
    #qrImage {
      display:none;
      width:min(340px,100%);
      height:auto;
      image-rendering:pixelated;
    }
    .placeholder {
      color:var(--muted);
      font-size:16px;
      font-weight:700;
      line-height:1.5;
      text-align:center;
      white-space:pre-line;
    }
    .status {
      min-height:20px;
      margin-top:11px;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      line-height:1.45;
    }
  </style>
</head>
<body>
<main>
  <div class="shell">
    <nav class="tabs" aria-label="點位清單">
      <button class="tab active" type="button" data-mode="patrol" aria-selected="true">巡</button>
      <button class="tab" type="button" data-mode="select" aria-selected="false">選</button>
      <button class="tab" type="button" data-mode="merged" aria-selected="false">合併</button>
    </nav>

    <section class="card" aria-live="polite">
      <h1 id="placeName">正在定位…</h1>
      <p class="distance" id="distance">距離：— 公尺</p>

      <div class="qr-wrap">
        <img id="qrImage" alt="最近點位 QR Code">
        <div class="placeholder" id="placeholder">正在取得目前位置…</div>
      </div>

      <div class="status" id="status">請允許瀏覽器使用定位權限。</div>
    </section>
  </div>
</main>

  const nameEl = document.getElementById("placeName");
  const distanceEl = document.getElementById("distance");
  const qrEl = document.getElementById("qrImage");
  const placeholderEl = document.getElementById("placeholder");
  const statusEl = document.getElementById("status");
  const tabs = [...document.querySelectorAll(".tab")];

  let mode = "patrol";
  let lastPosition = null;
  let watchId = null;
  let retryTimer = null;

  const toRad = v => v * Math.PI / 180;

  function distanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = toRad(lat2-lat1);
    const dLon = toRad(lon2-lon1);
    const a =
      Math.sin(dLat/2)**2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function currentPoints() {
    if (mode === "patrol") return PATROL_POINTS;
    if (mode === "select") return SELECT_POINTS;
    return PATROL_POINTS.concat(SELECT_POINTS);
  }

  function findNearest(latitude, longitude, points) {
    let nearest = null;
    for (const p of points) {
      const d = distanceMeters(latitude, longitude, p.lat, p.lon);
      if (!nearest || d < nearest.distance) {
        nearest = { point:p, distance:d };
      }
    }
    return nearest;
  }

  function setWaiting(title, detail) {
    nameEl.textContent = title;
    distanceEl.textContent = "距離：— 公尺";
    qrEl.style.display = "none";
    placeholderEl.style.display = "block";
    placeholderEl.textContent = title;
    statusEl.textContent = detail || "";
  }

  function renderCurrent() {
    if (!lastPosition) {
      setWaiting("正在定位…", "請允許瀏覽器使用定位權限。");
      return;
    }

    const points = currentPoints();
    const nearest = findNearest(
      lastPosition.coords.latitude,
      lastPosition.coords.longitude,
      points
    );

    if (!nearest) {
      setWaiting("沒有可用地點", "目前清單沒有可用座標。");
      return;
    }

    nameEl.textContent = nearest.point.name;
    distanceEl.textContent =
      `距離：${Math.round(nearest.distance).toLocaleString("zh-Hant-TW")} 公尺`;

    qrEl.src = nearest.point.qrImage;
    qrEl.alt = `${nearest.point.name} QR Code`;
    qrEl.style.display = "block";
    placeholderEl.style.display = "none";

    const accuracy = Math.round(lastPosition.coords.accuracy || 0);
    const listName =
      mode === "patrol" ? "巡" :
      mode === "select" ? "選" : "合併";
    statusEl.textContent =
      `${listName}清單｜定位持續更新中｜目前定位精確度約 ±${accuracy} 公尺`;
  }

  function setMode(nextMode) {
    mode = nextMode;
    tabs.forEach(btn => {
      const active = btn.dataset.mode === mode;
      btn.classList.toggle("active", active);
      btn.setAttribute("aria-selected", active ? "true" : "false");
    });
    renderCurrent();
  }

  tabs.forEach(btn => {
    btn.addEventListener("click", () => setMode(btn.dataset.mode));
  });

  function clearWatch() {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
  }

  function handlePosition(position) {
    lastPosition = position;
    renderCurrent();
  }

  function handleError(error) {
    clearWatch();

    const messages = {
      1:"定位權限遭拒絕，請到瀏覽器網站權限設定中允許位置存取。",
      2:"目前無法取得位置，請確認手機定位功能已開啟。",
      3:"定位逾時，系統將自動重新嘗試。"
    };

    setWaiting(
      "定位失敗",
      error.code === 1
        ? "允許定位後，重新整理頁面即可使用。"
        : "系統將於 5 秒後自動重新定位。"
    );
    placeholderEl.textContent = messages[error.code] || "定位時發生錯誤。";

    if (error.code !== 1) {
      window.clearTimeout(retryTimer);
      retryTimer = window.setTimeout(startLocation, 5000);
    }
  }

  function startLocation() {
    window.clearTimeout(retryTimer);

    if (!("geolocation" in navigator)) {
      setWaiting("不支援定位", "此瀏覽器不支援定位功能。");
      return;
    }

    clearWatch();
    setWaiting("正在定位…", "請允許瀏覽器使用定位權限。");

    watchId = navigator.geolocation.watchPosition(
      handlePosition,
      handleError,
      {
        enableHighAccuracy:true,
        maximumAge:2000,
        timeout:15000
      }
    );
  }

  startLocation();

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && watchId === null) startLocation();
  });
})();
</script>
