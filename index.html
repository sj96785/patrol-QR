<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="巡邏QR">
  <title>最近 QR 點位</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#fff;
      --card:#f4f4f6;
      --line:#dedee3;
      --text:#111;
      --muted:#666;
      --selected:#111;
      --selectedText:#fff;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",
        "PingFang TC","Microsoft JhengHei",sans-serif;
    }
    main {
      min-height:100vh;
      min-height:100dvh;
      width:100%;
      padding:max(14px,env(safe-area-inset-top))
              max(16px,env(safe-area-inset-right))
              max(18px,env(safe-area-inset-bottom))
              max(16px,env(safe-area-inset-left));
    }
    .shell { width:min(520px,100%); margin:0 auto; }
    .tabs {
      position:sticky;
      top:max(8px,env(safe-area-inset-top));
      z-index:10;
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:6px;
      padding:5px;
      margin:0 0 12px;
      background:rgba(244,244,246,.94);
      border:1px solid var(--line);
      border-radius:15px;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }
    .tab {
      appearance:none;
      border:0;
      border-radius:11px;
      background:transparent;
      color:var(--text);
      padding:10px 8px;
      font-size:17px;
      font-weight:900;
      line-height:1;
      cursor:pointer;
    }
    .tab.active { background:var(--selected); color:var(--selectedText); }
    .card {
      width:100%;
      padding:20px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:0 10px 30px rgba(0,0,0,.05);
    }
    .caption { margin:0; font-size:13px; font-weight:800; color:var(--muted); }
    h1 {
      margin:7px 0 4px;
      font-size:clamp(24px,7vw,30px);
      line-height:1.25;
      overflow-wrap:anywhere;
    }
    .distance { margin:0 0 16px; font-size:21px; font-weight:900; }
    .qr-wrap {
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:280px;
      padding:10px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
    }
    #qrImage {
      display:none;
      width:min(340px,100%);
      height:auto;
      image-rendering:pixelated;
    }
    .placeholder {
      color:var(--muted);
      font-size:16px;
      font-weight:700;
      line-height:1.5;
      text-align:center;
      white-space:pre-line;
    }
    .status {
      min-height:20px;
      margin-top:11px;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      line-height:1.45;
    }
    .attribution {
      margin:9px 3px 0;
      color:#8a8a8f;
      font-size:10px;
      text-align:center;
    }
  </style>
</head>
<body>
<main>
  <div class="shell">
    <nav class="tabs" aria-label="點位清單">
      <button class="tab active" type="button" data-mode="patrol" aria-selected="true">巡</button>
      <button class="tab" type="button" data-mode="select" aria-selected="false">選</button>
      <button class="tab" type="button" data-mode="merged" aria-selected="false">合併</button>
    </nav>

    <section class="card" aria-live="polite">
      <p class="caption" id="caption">距離目前位置最近的巡邏點</p>
      <h1 id="placeName">正在定位…</h1>
      <p class="distance" id="distance">距離：— 公尺</p>

      <div class="qr-wrap">
        <img id="qrImage" alt="最近點位 QR Code">
        <div class="placeholder" id="placeholder">正在取得目前位置…</div>
      </div>

      <div class="status" id="status">請允許瀏覽器使用定位權限。</div>
    </section>

    <div class="attribution" id="attribution" hidden>
      選清單地址定位資料：© OpenStreetMap contributors / Nominatim
    </div>
  </div>
</main>

  const distanceEl = document.getElementById("distance");
  const qrEl = document.getElementById("qrImage");
  const placeholderEl = document.getElementById("placeholder");
  const statusEl = document.getElementById("status");
  const captionEl = document.getElementById("caption");
  const attributionEl = document.getElementById("attribution");
  const tabs = [...document.querySelectorAll(".tab")];

  let mode = "patrol";
  let lastPosition = null;
  let watchId = null;
  let retryTimer = null;
  let preparingSelect = false;
  let selectReady = false;
  let geocodeFailures = 0;

  function loadCoordinateCache() {
    try {
      return JSON.parse(localStorage.getItem(CACHE_KEY) || "{}");
    } catch {
      return {};
    }
  }

  function saveCoordinateCache(cache) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch {}
  }

  function applyCachedCoordinates() {
    const cache = loadCoordinateCache();
    let ready = 0;
    for (const p of SELECT_POINTS) {
      const c = cache[p.address];
      if (c && Number.isFinite(c.lat) && Number.isFinite(c.lon)) {
        p.lat = c.lat;
        p.lon = c.lon;
        ready++;
      }
    }
    selectReady = ready === SELECT_POINTS.length;
    return ready;
  }

  const toRad = v => v * Math.PI / 180;

  function distanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = toRad(lat2-lat1);
    const dLon = toRad(lon2-lon1);
    const a =
      Math.sin(dLat/2)**2 +
      Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function currentPoints() {
    if (mode === "patrol") return PATROL_POINTS;
    if (mode === "select") return SELECT_POINTS.filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));
    return PATROL_POINTS.concat(
      SELECT_POINTS.filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon))
    );
  }

  function findNearest(latitude, longitude, points) {
    let nearest = null;
    for (const p of points) {
      if (!Number.isFinite(p.lat) || !Number.isFinite(p.lon)) continue;
      const d = distanceMeters(latitude, longitude, p.lat, p.lon);
      if (!nearest || d < nearest.distance) nearest = { point:p, distance:d };
    }
    return nearest;
  }

  function setWaiting(message, status="") {
    nameEl.textContent = message;
    distanceEl.textContent = "距離：— 公尺";
    qrEl.style.display = "none";
    placeholderEl.style.display = "block";
    placeholderEl.textContent = message;
    statusEl.textContent = status;
  }

  function renderCurrent() {
    attributionEl.hidden = mode === "patrol";

    if (!lastPosition) {
      setWaiting("正在定位…", "請允許瀏覽器使用定位權限。");
      return;
    }

    if ((mode === "select" || mode === "merged") && !selectReady) {
      const done = SELECT_POINTS.filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon)).length;
      setWaiting(
        "正在建立選清單座標…",
        `首次使用需依地址建立座標，目前 ${done} / ${SELECT_POINTS.length}。`
      );
      prepareSelectCoordinates();
      return;
    }

    const points = currentPoints();
    const nearest = findNearest(
      lastPosition.coords.latitude,
      lastPosition.coords.longitude,
      points
    );

    if (!nearest) {
      setWaiting("沒有可用點位", "目前清單沒有可比較的 GPS 座標。");
      return;
    }

    nameEl.textContent = nearest.point.name;
    distanceEl.textContent =
      `距離：${Math.round(nearest.distance).toLocaleString("zh-Hant-TW")} 公尺`;
    qrEl.src = nearest.point.qrImage;
    qrEl.alt = `${nearest.point.name} QR Code`;
    qrEl.style.display = "block";
    placeholderEl.style.display = "none";

    const accuracy = Math.round(lastPosition.coords.accuracy || 0);
    const label =
      mode === "patrol" ? "巡清單" :
      mode === "select" ? "選清單" : "合併清單";
    statusEl.textContent =
      `${label}・定位持續更新中；目前定位精確度約 ±${accuracy} 公尺。`;
  }

  function setMode(nextMode) {
    mode = nextMode;
    tabs.forEach(btn => {
      const active = btn.dataset.mode === mode;
      btn.classList.toggle("active", active);
      btn.setAttribute("aria-selected", active ? "true" : "false");
    });

    captionEl.textContent =
      mode === "patrol" ? "距離目前位置最近的巡邏點" :
      mode === "select" ? "距離目前位置最近的選清單點位" :
      "距離目前位置最近的巡＋選合併點位";

    renderCurrent();
  }

  tabs.forEach(btn => btn.addEventListener("click", () => setMode(btn.dataset.mode)));

  function normalizeAddress(address) {
    // 里名通常不屬正式門牌的一部分，移除可提高地址查找成功率。
    return ("高雄市" + address)
      .replace(/左營區[^里]+里/g, "左營區")
      .replace(/之/g, "-");
  }

  async function nominatim(query) {
    const url =
      "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=tw&q=" +
      encodeURIComponent(query);
    const response = await fetch(url, {
      headers: { "Accept":"application/json" },
      cache: "no-store"
    });
    if (!response.ok) throw new Error("Nominatim HTTP " + response.status);
    const rows = await response.json();
    if (!rows || !rows.length) return null;
    const lat = Number(rows[0].lat);
    const lon = Number(rows[0].lon);
    return Number.isFinite(lat) && Number.isFinite(lon) ? {lat,lon} : null;
  }

  async function geocodePoint(point) {
    const queries = [
      normalizeAddress(point.address),
      "高雄市" + point.address,
      point.name + " 高雄市左營區"
    ];
    for (const q of queries) {
      try {
        const result = await nominatim(q);
        if (result) return result;
      } catch {}
    }
    return null;
  }

  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function prepareSelectCoordinates() {
    if (preparingSelect || selectReady) return;
    preparingSelect = true;

    const cache = loadCoordinateCache();
    applyCachedCoordinates();

    if (selectReady) {
      preparingSelect = false;
      renderCurrent();
      return;
    }

    geocodeFailures = 0;
    for (let i=0; i<SELECT_POINTS.length; i++) {
      const p = SELECT_POINTS[i];
      if (Number.isFinite(p.lat) && Number.isFinite(p.lon)) continue;

      if (mode !== "patrol") {
        const done = SELECT_POINTS.filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lon)).length;
        statusEl.textContent =
          `首次使用需依地址建立座標，目前 ${done} / ${SELECT_POINTS.length}。`;
      }

      const result = await geocodePoint(p);
      if (result) {
        p.lat = result.lat;
        p.lon = result.lon;
        cache[p.address] = result;
        saveCoordinateCache(cache);
      } else {
        geocodeFailures++;
      }

      // 公開地址查詢服務採低頻率使用，避免大量同時請求。
      await sleep(1050);
    }

    const readyCount = SELECT_POINTS.filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon)).length;
    selectReady = readyCount === SELECT_POINTS.length;
    preparingSelect = false;

    if (!selectReady) {
      if (mode !== "patrol") {
        setWaiting(
          "部分選清單地址無法定位",
          `已取得 ${readyCount} / ${SELECT_POINTS.length} 筆座標；未定位完成前不顯示最近點，避免判斷錯誤。`
        );
      }
      return;
    }

    renderCurrent();
  }

  function onPosition(position) {
    lastPosition = position;
    renderCurrent();
  }

  function clearWatch() {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
  }

  function onPositionError(error) {
    clearWatch();
    const messages = {
      1:"定位權限遭拒絕，請到瀏覽器網站權限設定中允許位置存取。",
      2:"目前無法取得位置，請確認手機定位功能已開啟。",
      3:"定位逾時，系統將自動重新嘗試。"
    };
    setWaiting("定位失敗", messages[error.code] || "定位時發生錯誤。");
    if (error.code !== 1) {
      clearTimeout(retryTimer);
      retryTimer = setTimeout(startLocation, 5000);
    }
  }

  function startLocation() {
    clearTimeout(retryTimer);
    if (!("geolocation" in navigator)) {
      setWaiting("不支援定位", "此瀏覽器不支援定位功能。");
      return;
    }
    clearWatch();
    watchId = navigator.geolocation.watchPosition(
      onPosition,
      onPositionError,
      { enableHighAccuracy:true, maximumAge:2000, timeout:15000 }
    );
  }

  applyCachedCoordinates();
  startLocation();

  // 背景預先建立【選】清單座標；【巡】不必等待。
  setTimeout(prepareSelectCoordinates, 800);

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && watchId === null) startLocation();
  });
})();
</script>
</body>
</html>
