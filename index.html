<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="巡邏QR">
  <title>巡邏 QR 地圖</title>

  <!-- 地圖元件；單一 HTML 直接放 GitHub Pages 即可 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      color-scheme:light;
      --bg:#fff;
      --card:#f4f4f6;
      --line:#dedee3;
      --text:#111;
      --muted:#666;
      --blue:#1677ff;
      --green:#20a75a;
      --red:#ff3b30;
    }
    * { box-sizing:border-box; }
    html,body {
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
    }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",
        "PingFang TC","Microsoft JhengHei",sans-serif;
    }
    main {
      min-height:100vh;
      min-height:100dvh;
      width:100%;
      padding:max(12px,env(safe-area-inset-top))
              max(14px,env(safe-area-inset-right))
              max(16px,env(safe-area-inset-bottom))
              max(14px,env(safe-area-inset-left));
    }
    .shell {
      width:min(600px,100%);
      margin:0 auto;
    }
    .tabs {
      position:sticky;
      top:max(6px,env(safe-area-inset-top));
      z-index:1000;
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:6px;
      padding:5px;
      margin:0 0 10px;
      background:rgba(244,244,246,.94);
      border:1px solid var(--line);
      border-radius:15px;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }
    .tab {
      appearance:none;
      border:0;
      border-radius:11px;
      background:transparent;
      color:var(--text);
      padding:11px 8px;
      font-size:18px;
      font-weight:900;
      line-height:1;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .tab.active {
      background:#111;
      color:#fff;
    }
    .card {
      width:100%;
      padding:20px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:0 10px 30px rgba(0,0,0,.05);
    }
    h1 {
      margin:0 0 5px;
      font-size:clamp(24px,7vw,30px);
      line-height:1.25;
      overflow-wrap:anywhere;
    }
    .address {
      display:none;
      margin:0 0 8px;
      color:var(--muted);
      font-size:15px;
      font-weight:700;
      line-height:1.45;
      overflow-wrap:anywhere;
    }
    .distance {
      margin:0 0 16px;
      font-size:21px;
      font-weight:900;
    }
    .qr-wrap {
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:280px;
      padding:10px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
    }
    #qrImage {
      display:none;
      width:min(340px,100%);
      height:auto;
      image-rendering:pixelated;
    }
    .placeholder {
      color:var(--muted);
      font-size:16px;
      font-weight:700;
      line-height:1.5;
      text-align:center;
      white-space:pre-line;
    }
    .status {
      min-height:20px;
      margin-top:11px;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      line-height:1.45;
    }

    /* 地圖頁 */
    #nearestView { display:block; }
    #mapView { display:none; }
    .map-card {
      overflow:hidden;
      padding:0;
      background:#fff;
    }
    #map {
      width:100%;
      height:calc(100dvh - 92px);
      min-height:430px;
      max-height:820px;
      background:#e9edf1;
    }
    .map-legend {
      display:flex;
      gap:14px;
      align-items:center;
      flex-wrap:wrap;
      padding:10px 12px;
      border-top:1px solid var(--line);
      font-size:13px;
      font-weight:800;
      background:#fff;
    }
    .legend-item {
      display:flex;
      align-items:center;
      gap:6px;
    }
    .legend-dot {
      width:11px;
      height:11px;
      border-radius:50%;
      display:inline-block;
    }
    .legend-dot.blue { background:var(--blue); }
    .legend-dot.green { background:var(--green); }
    .legend-dot.red { background:var(--red); }

    /* Leaflet 自訂標記，不需要額外圖片檔 */
    .custom-marker-wrap {
      background:transparent !important;
      border:0 !important;
    }
    .map-dot {
      display:block;
      width:20px;
      height:20px;
      border-radius:50%;
      border:3px solid #fff;
      box-shadow:0 2px 8px rgba(0,0,0,.38);
    }
    .map-dot.patrol { background:var(--blue); }
    .map-dot.select { background:var(--green); }
    .map-dot.user {
      width:22px;
      height:22px;
      background:var(--red);
      box-shadow:0 0 0 7px rgba(255,59,48,.18),0 2px 8px rgba(0,0,0,.3);
    }
    .map-popup {
      width:210px;
      text-align:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",
        "PingFang TC","Microsoft JhengHei",sans-serif;
    }
    .map-popup .type {
      display:inline-block;
      margin-bottom:5px;
      padding:3px 8px;
      border-radius:999px;
      color:#fff;
      font-size:12px;
      font-weight:900;
    }
    .map-popup .type.patrol { background:var(--blue); }
    .map-popup .type.select { background:var(--green); }
    .map-popup .name {
      margin:0 0 5px;
      font-size:15px;
      font-weight:900;
      line-height:1.35;
    }
    .map-popup .addr {
      margin:0 0 7px;
      color:#555;
      font-size:12px;
      font-weight:600;
      line-height:1.4;
    }
    .map-popup .qr {
      display:block;
      width:180px;
      max-width:100%;
      height:auto;
      margin:8px auto 0;
    }
    .leaflet-popup-content {
      margin:12px 14px;
    }
  </style>
</head>
<body>
<main>
  <div class="shell">
    <nav class="tabs" aria-label="功能分頁">
      <button class="tab active" type="button" data-mode="patrol" aria-selected="true">巡</button>
      <button class="tab" type="button" data-mode="select" aria-selected="false">選</button>
      <button class="tab" type="button" data-mode="map" aria-selected="false">圖</button>
    </nav>

    <section id="nearestView" class="card" aria-live="polite">
      <h1 id="placeName">正在定位…</h1>
      <p class="address" id="placeAddress"></p>
      <p class="distance" id="distance">距離：— 公尺</p>

      <div class="qr-wrap">
        <img id="qrImage" alt="最近點位 QR Code">
        <div class="placeholder" id="placeholder">正在取得目前位置…</div>
      </div>

      <div class="status" id="status">請允許瀏覽器使用定位權限。</div>
    </section>

    <section id="mapView" class="card map-card">
      <div id="map"></div>
      <div class="map-legend">
        <span class="legend-item"><span class="legend-dot red"></span>目前位置</span>
        <span class="legend-item"><span class="legend-dot blue"></span>巡</span>
        <span class="legend-item"><span class="legend-dot green"></span>選</span>
      </div>
    </section>
  </div>
</main>

  const ALL_POINTS = PATROL_POINTS.concat(SELECT_POINTS);

  const nameEl = document.getElementById("placeName");
  const addressEl = document.getElementById("placeAddress");
  const distanceEl = document.getElementById("distance");
  const qrEl = document.getElementById("qrImage");
  const placeholderEl = document.getElementById("placeholder");
  const statusEl = document.getElementById("status");
  const nearestView = document.getElementById("nearestView");
  const mapView = document.getElementById("mapView");
  const tabs = [...document.querySelectorAll(".tab")];

  let mode = "patrol";
  let lastPosition = null;
  let watchId = null;
  let retryTimer = null;

  let map = null;
  let mapMarkersReady = false;
  let userMarker = null;
  let mapHasFitted = false;

  const toRad = v => v * Math.PI / 180;

  function distanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = toRad(lat2-lat1);
    const dLon = toRad(lon2-lon1);
    const a =
      Math.sin(dLat/2)**2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function currentPoints() {
    return mode === "select" ? SELECT_POINTS : PATROL_POINTS;
  }

  function findNearest(latitude, longitude, points) {
    let nearest = null;
    for (const p of points) {
      const d = distanceMeters(latitude, longitude, p.lat, p.lon);
      if (!nearest || d < nearest.distance) {
        nearest = { point:p, distance:d };
      }
    }
    return nearest;
  }

  function setWaiting(title, detail) {
    nameEl.textContent = title;
    addressEl.textContent = "";
    addressEl.style.display = "none";
    distanceEl.textContent = "距離：— 公尺";
    qrEl.style.display = "none";
    placeholderEl.style.display = "block";
    placeholderEl.textContent = title;
    statusEl.textContent = detail || "";
  }

  function renderNearest() {
    if (mode === "map") return;

    if (!lastPosition) {
      setWaiting("正在定位…", "請允許瀏覽器使用定位權限。");
      return;
    }

    const nearest = findNearest(
      lastPosition.coords.latitude,
      lastPosition.coords.longitude,
      currentPoints()
    );

    if (!nearest) {
      setWaiting("沒有可用地點", "目前清單沒有可用座標。");
      return;
    }

    nameEl.textContent = nearest.point.name;

    if (mode === "select" && nearest.point.address) {
      addressEl.textContent = nearest.point.address;
      addressEl.style.display = "block";
    } else {
      addressEl.textContent = "";
      addressEl.style.display = "none";
    }

    distanceEl.textContent =
      `距離：${Math.round(nearest.distance).toLocaleString("zh-Hant-TW")} 公尺`;

    qrEl.src = nearest.point.qrImage;
    qrEl.alt = `${nearest.point.name} QR Code`;
    qrEl.style.display = "block";
    placeholderEl.style.display = "none";

    const accuracy = Math.round(lastPosition.coords.accuracy || 0);
    const listName = mode === "select" ? "選" : "巡";
    statusEl.textContent =
      `${listName}清單｜定位持續更新中｜目前定位精確度約 ±${accuracy} 公尺`;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function popupHtml(point) {
    const cls = point.group === "巡" ? "patrol" : "select";
    const address = point.address
      ? `<p class="addr">${escapeHtml(point.address)}</p>`
      : "";
    return `
      <div class="map-popup">
        <span class="type ${cls}">${point.group}</span>
        <p class="name">${escapeHtml(point.name)}</p>
        ${address}
        <img class="qr" src="${point.qrImage}" alt="${escapeHtml(point.name)} QR Code">
      </div>
    `;
  }

  function pointIcon(group) {
    const cls = group === "巡" ? "patrol" : "select";
    return L.divIcon({
      className:"custom-marker-wrap",
      html:`<span class="map-dot ${cls}"></span>`,
      iconSize:[20,20],
      iconAnchor:[10,10],
      popupAnchor:[0,-10]
    });
  }

  function userIcon() {
    return L.divIcon({
      className:"custom-marker-wrap",
      html:'<span class="map-dot user"></span>',
      iconSize:[22,22],
      iconAnchor:[11,11]
    });
  }

  function ensureMap() {
    if (map) {
      setTimeout(() => map.invalidateSize(), 60);
      return;
    }

    if (typeof L === "undefined") {
      document.getElementById("map").innerHTML =
        '<div style="padding:24px;font-weight:800;color:#666">地圖元件載入失敗，請確認目前有網路連線。</div>';
      return;
    }

    map = L.map("map", {
      zoomControl:true,
      attributionControl:true
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom:19,
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);

    if (!mapMarkersReady) {
      for (const point of ALL_POINTS) {
        L.marker([point.lat, point.lon], {
          icon:pointIcon(point.group),
          title:point.name
        })
        .addTo(map)
        .bindPopup(popupHtml(point), { maxWidth:240 });
      }
      mapMarkersReady = true;
    }

    fitMapToAll();
    updateUserOnMap();
  }

  function fitMapToAll() {
    if (!map) return;

    const latlngs = ALL_POINTS.map(p => [p.lat,p.lon]);
    if (lastPosition) {
      latlngs.push([
        lastPosition.coords.latitude,
        lastPosition.coords.longitude
      ]);
    }

    if (latlngs.length) {
      map.fitBounds(latlngs, {
        padding:[28,28],
        maxZoom:16
      });
      mapHasFitted = true;
    }
  }

  function updateUserOnMap() {
    if (!map || !lastPosition) return;

    const latlng = [
      lastPosition.coords.latitude,
      lastPosition.coords.longitude
    ];

    if (!userMarker) {
      userMarker = L.marker(latlng, {
        icon:userIcon(),
        zIndexOffset:1000,
        title:"目前位置"
      })
      .addTo(map)
      .bindPopup("<strong>目前位置</strong>");
    } else {
      userMarker.setLatLng(latlng);
    }

    if (mode === "map") {
      const bounds = map.getBounds();
      if (bounds.isValid() && !bounds.pad(-0.12).contains(latlng)) {
        map.panTo(latlng, { animate:true });
      }
    }
  }

  function setMode(nextMode) {
    mode = nextMode;

    tabs.forEach(btn => {
      const active = btn.dataset.mode === mode;
      btn.classList.toggle("active",active);
      btn.setAttribute("aria-selected",active ? "true" : "false");
    });

    if (mode === "map") {
      nearestView.style.display = "none";
      mapView.style.display = "block";
      ensureMap();
      setTimeout(() => {
        if (map) {
          map.invalidateSize();
          if (!mapHasFitted) fitMapToAll();
        }
      }, 80);
    } else {
      mapView.style.display = "none";
      nearestView.style.display = "block";
      renderNearest();
    }
  }

  tabs.forEach(btn => {
    btn.addEventListener("click", () => setMode(btn.dataset.mode));
  });

  function clearWatch() {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
  }

  function handlePosition(position) {
    lastPosition = position;
    renderNearest();
    updateUserOnMap();
  }

  function handleError(error) {
    clearWatch();

    const messages = {
      1:"定位權限遭拒絕，請到瀏覽器網站權限設定中允許位置存取。",
      2:"目前無法取得位置，請確認手機定位功能已開啟。",
      3:"定位逾時，系統將自動重新嘗試。"
    };

    if (mode !== "map") {
      setWaiting(
        "定位失敗",
        error.code === 1
          ? "允許定位後，重新整理頁面即可使用。"
          : "系統將於 5 秒後自動重新定位。"
      );
      placeholderEl.textContent =
        messages[error.code] || "定位時發生錯誤。";
    }

    if (error.code !== 1) {
      window.clearTimeout(retryTimer);
      retryTimer = window.setTimeout(startLocation,5000);
    }
  }

  function startLocation() {
    window.clearTimeout(retryTimer);

    if (!("geolocation" in navigator)) {
      if (mode !== "map") {
        setWaiting("不支援定位","此瀏覽器不支援定位功能。");
      }
      return;
    }

    clearWatch();

    if (mode !== "map") {
      setWaiting("正在定位…","請允許瀏覽器使用定位權限。");
    }

    watchId = navigator.geolocation.watchPosition(
      handlePosition,
      handleError,
      {
        enableHighAccuracy:true,
        maximumAge:2000,
        timeout:15000
      }
    );
  }

  startLocation();

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && watchId === null) startLocation();
    if (!document.hidden && mode === "map" && map) {
      setTimeout(() => map.invalidateSize(),80);
    }
  });
})();
</script>
</body>
</html>
